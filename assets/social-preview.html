<!--
  The source of the social preview card. Open it in a browser: what you see at 1280×640 is
  the card. assets/social-preview.png is rendered from this file with headless Chrome,
  never drawn by hand — the command is in CLAUDE.md (DG-23).

  The mark is assets/logo.svg itself, referenced by a relative path — not a copy — so
  the card cannot drift from the favicon and the README. The colours are the site's dark
  theme. The finding line is the real output shape, masked as the tool masks it.
-->
