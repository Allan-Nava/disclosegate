name: Backlog issues

# Keep the GitHub issues in step with BACKLOG.md.
#
# BACKLOG.md is the single source of truth, the same way it is for ROADMAP.md: an
# item's stable DG-n id is what commits and the CHANGELOG reference, and the issue
# is a view of it. The sync runs one way only — backlog to issues, never the
# reverse. Editing an issue title or closing it on GitHub does not change the plan;
# ticking the item in BACKLOG.md does.
#
# It runs only when BACKLOG.md itself changes, because nothing else can alter the
# plan, and on demand so a first run can be done deliberately.

on:
  push:
    branches: [main]
    paths:
      - BACKLOG.md
      - .github/workflows/backlog-issues.yml
  workflow_dispatch:
    inputs:
      milestones:
        description: "Limit to these milestones by version, comma-separated (e.g. v0.1.0). Empty means all."
        required: false
        default: ""
      dry_run:
        description: "Print the plan without changing anything"
        type: boolean
        required: false
        default: false

# The default token is read-only for contents; opening and closing issues needs
# this. Nothing here writes to the repository itself.
permissions:
  contents: read
  issues: write

concurrency:
  # Two runs racing would both see "no issue for DG-n" and open it twice.
  group: backlog-issues
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # backlogsync prints the plan before it applies anything, so the run's log says
      # what it was about to do even if a write fails (DG-28).
      - uses: Allan-Nava/backlogsync@backlogsync--v0.1.0
        with:
          command: sync
          dry-run: ${{ github.event.inputs.dry_run == 'true' }}
          milestones: ${{ github.event.inputs.milestones }}
